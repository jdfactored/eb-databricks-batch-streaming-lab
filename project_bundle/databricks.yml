# Databricks Asset Bundle for the Batch & Streaming lab.
#
# This file and the job resource are what B04 Step 4 asks you to complete and deploy.
# `databricks.yml` is finished — you only need to edit resources/batch_pipeline.job.yml.

bundle:
  name: de013_batch_streaming

include:
  - resources/*.yml

variables:
  env:
    description: Deployment environment, used in resource names.
    default: dev
  target_catalog:
    description: Unity Catalog catalog the notebooks read and write.
    default: capstone_dev
  notebook_root:
    description: Workspace path holding the lab notebooks.
    default: /Workspace/Users/${workspace.current_user.userName}/de013-lab/notebooks

targets:
  dev:
    mode: development     # prefixes resources with [dev <user>] and pauses schedules
    default: true
    workspace:
      host: https://factored-training.cloud.databricks.com

  prod:
    mode: production
    workspace:
      host: https://factored-training.cloud.databricks.com
      root_path: /Workspace/Users/${workspace.current_user.userName}/.bundle/${bundle.name}/${bundle.target}
    variables:
      env: prd
      target_catalog: capstone_prd
