# B04 Step 4 — complete this job definition.
#
# Task 1 is filled in as a worked example. Add the two remaining tasks so the job runs
# B01 -> B02 -> B04 in order. Every task needs:
#
#   task_key           unique within the job
#   notebook_task      which notebook, and the parameters it receives
#   depends_on         which task must finish first
#
# Serverless is used by omitting any compute block: leave out job_clusters and
# existing_cluster_id and the task runs on serverless compute.

resources:
  jobs:
    batch_pipeline_job:
      name: ${var.env}_batch_pipeline_${workspace.current_user.short_name}
      description: Ingest sales CDC, validate it, and build the gold layer.

      parameters:
        - name: catalog
          default: ${var.target_catalog}

      tasks:
        # ---- Worked example: copy this shape for the tasks below ----------------
        - task_key: ingest_and_merge
          notebook_task:
            notebook_path: ${var.notebook_root}/B01-batch-ingestion-and-delta
            base_parameters:
              catalog: ${var.target_catalog}
            source: WORKSPACE

        # ---- TO DO: data quality, depends on ingest_and_merge -------------------
        - task_key: # TO DO
          depends_on:
            - task_key: # TO DO
          notebook_task:
            notebook_path: # TO DO
            base_parameters:
              catalog: ${var.target_catalog}
            source: WORKSPACE

        # ---- TO DO: gold build, depends on the data quality task ----------------
        - task_key: # TO DO
          depends_on:
            - task_key: # TO DO
          notebook_task:
            notebook_path: # TO DO
            base_parameters:
              catalog: ${var.target_catalog}
            source: WORKSPACE

      queue:
        enabled: true

      # TO DO (optional): add a daily schedule. Note that `mode: development` pauses it.
      # schedule:
      #   quartz_cron_expression: "0 0 6 * * ?"
      #   timezone_id: America/Bogota
      #   pause_status: PAUSED

      email_notifications:
        on_failure:
          - ${workspace.current_user.userName}
